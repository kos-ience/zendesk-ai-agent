name: Self-Healing CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tests_failed: ${{ steps.tests.outputs.failed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "langfuse>=2.0.0,<3.0.0"
          pip install -e ".[dev]"
          pip install pytest pytest-cov pytest-asyncio pytest-mock respx
      
      - name: Run tests
        id: tests
        run: |
          set +e
          pytest tests/ -v --tb=long 2>&1 | tee test_output.log
          EXIT_CODE=$?
          set -e
          
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "❌ Tests failed with exit code $EXIT_CODE"
          else
            echo "failed=false" >> $GITHUB_OUTPUT
            echo "✅ Tests passed"
          fi
      
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_output.log
      
      - name: Fail job if tests failed
        if: steps.tests.outputs.failed == 'true'
        run: |
          echo "Tests failed! Triggering claude-fix job..."
          exit 1

  claude-fix:
    needs: test
    if: always() && needs.test.outputs.tests_failed == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Download test logs
        uses: actions/download-artifact@v4
        with:
          name: test-logs
          path: .
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "langfuse>=2.0.0,<3.0.0"
          pip install -e ".[dev]"
          pip install pytest pytest-cov pytest-asyncio pytest-mock respx
      
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Claude Fix Build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "📋 Test failure log:"
          cat test_output.log
          
          echo ""
          echo "🤖 Asking Claude to fix the build..."
          
          $HOME/.local/bin/claude -p "The pytest tests are failing. Analyze test_output.log, fix the bug in the source code (not the tests), run pytest to verify, and commit with message 'Claude fix: [description]'. Follow CLAUDE.md guidelines." --allowedTools "Bash,Edit,Write,View,GlobTool,GrepTool" || true
      
      - name: Push fixes if any
        run: |
          git config user.name "Claude AI"
          git config user.email "claude@anthropic.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "📝 Changes detected, pushing Claude's fixes..."
            git add .
            git commit -m "Claude fix: Auto-fix from CI" || true
            git push origin HEAD:${{ github.head_ref }}
            echo "✅ Fixes pushed!"
          else
            echo "No changes to push"
          fi
      
      - name: Add label to PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['claude-fix-attempted']
            })
