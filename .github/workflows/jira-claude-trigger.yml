# Jira → Claude Auto-Implementation Workflow
# Triggered when a Jira ticket with "claude" in description is created
# Claude implements the code, creates PR, and comments back to Jira

name: Jira Claude Trigger

on:
  repository_dispatch:
    types: [jira-claude-trigger]

jobs:
  implement-ticket:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: 📋 Display Jira Ticket Info
        run: |
          echo "=========================================="
          echo "🎫 JIRA TICKET RECEIVED!"
          echo "=========================================="
          echo "Issue Key: ${{ github.event.client_payload.issue_key }}"
          echo "Summary: ${{ github.event.client_payload.issue_summary }}"
          echo "=========================================="

      - name: 🌿 Create Feature Branch
        run: |
          BRANCH_NAME="feature/${{ github.event.client_payload.issue_key }}"
          echo "Creating branch: $BRANCH_NAME"
          
          git config user.name "Claude AI"
          git config user.email "claude@anthropic.com"
          
          # Check if branch exists, if so add timestamp
          if git ls-remote --heads origin $BRANCH_NAME | grep -q $BRANCH_NAME; then
            BRANCH_NAME="${BRANCH_NAME}-$(date +%Y%m%d%H%M%S)"
            echo "Branch exists, using: $BRANCH_NAME"
          fi
          
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "langfuse>=2.0.0,<3.0.0"
          pip install -e ".[dev]"
          pip install pytest pytest-cov pytest-asyncio pytest-mock respx

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🤖 Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🚀 Claude Implements Ticket
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🎫 Implementing: ${{ github.event.client_payload.issue_key }}"
          echo "📝 Summary: ${{ github.event.client_payload.issue_summary }}"
          
          PROMPT="You are implementing Jira ticket ${{ github.event.client_payload.issue_key }}.

          Task: ${{ github.event.client_payload.issue_summary }}

          Instructions:
          1. Read CLAUDE.md for project guidelines
          2. Analyze the codebase to understand the structure
          3. Implement the requested changes
          4. Run pytest to verify tests pass
          5. Commit your changes with message: '${{ github.event.client_payload.issue_key }}: [description of changes]'

          Be thorough but focused. Only make changes relevant to this ticket."

          $HOME/.local/bin/claude --model opus -p "$PROMPT" --allowedTools "Bash,Edit,Write,View,GlobTool,GrepTool" || true

      - name: 📤 Push Changes
        run: |
          # Check for uncommitted changes first
          if [ -n "$(git status --porcelain)" ]; then
            echo "📝 Uncommitted changes detected, committing..."
            git add .
            git commit -m "${{ github.event.client_payload.issue_key }}: Implementation by Claude" || true
          fi
          
          # Check if we have any commits beyond main (Claude may have already committed)
          COMMITS_AHEAD=$(git rev-list --count origin/main..HEAD)
          echo "Commits ahead of main: $COMMITS_AHEAD"
          
          if [ "$COMMITS_AHEAD" -gt 0 ]; then
            echo "📤 Pushing $COMMITS_AHEAD commit(s) to $BRANCH_NAME..."
            git push origin $BRANCH_NAME
            echo "CHANGES_MADE=true" >> $GITHUB_ENV
          else
            echo "⚠️ No commits to push"
            echo "CHANGES_MADE=false" >> $GITHUB_ENV
          fi

      - name: 🔀 Create Pull Request
        if: env.CHANGES_MADE == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR_TITLE="${{ github.event.client_payload.issue_key }}: ${{ github.event.client_payload.issue_summary }}"
          PR_BODY="## 🎫 Jira Ticket
          **[${{ github.event.client_payload.issue_key }}](https://sachinkosepaul.atlassian.net/browse/${{ github.event.client_payload.issue_key }})**

          ## 📝 Summary
          ${{ github.event.client_payload.issue_summary }}

          ## 🤖 Implementation
          This PR was automatically generated by Claude Code based on the Jira ticket.

          ---
          *Automated by Jira-Claude Integration*"

          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head $BRANCH_NAME)
          
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          echo "✅ PR Created: $PR_URL"

      - name: 💬 Comment on Jira
        if: env.CHANGES_MADE == 'true'
        run: |
          echo "📝 Posting comment to Jira..."
          
          COMMENT="🤖 *Claude has implemented this ticket!*

          ✅ **Pull Request Created:** ${{ env.PR_URL }}

          The implementation is ready for review. Once approved and merged, the self-healing CI will run tests automatically.

          ---
          _Automated by Jira-Claude Integration_"

          curl -X POST \
            -H "Authorization: Basic $(echo -n 'sachinkosepaul@gmail.com:${{ secrets.JIRA_API_TOKEN }}' | base64)" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"$COMMENT\"}" \
            "https://sachinkosepaul.atlassian.net/rest/api/3/issue/${{ github.event.client_payload.issue_key }}/comment"
          
          echo "✅ Jira comment posted!"

      - name: 📊 Summary
        run: |
          echo "=========================================="
          echo "🏁 JIRA-CLAUDE WORKFLOW COMPLETE"
          echo "=========================================="
          echo "Ticket: ${{ github.event.client_payload.issue_key }}"
          echo "Branch: ${{ env.BRANCH_NAME }}"
          echo "Changes Made: ${{ env.CHANGES_MADE }}"
          if [ "${{ env.CHANGES_MADE }}" == "true" ]; then
            echo "PR: ${{ env.PR_URL }}"
          fi
          echo "=========================================="
