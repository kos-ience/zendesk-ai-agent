[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zendesk-ai-agent"
version = "1.0.0"
description = "Production-grade Zendesk-OpenAI integration for automated ticket responses"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Zendesk AI Agent Team"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "zenpy>=2.0.41",
    "openai>=1.0.0",
    # ===== PYDANTIC V2 (CURRENT) =====
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # ===== PYDANTIC V1 (FOR DEMO 2 - SWAP THESE) =====
    #"pydantic==1.10.26",
    # (comment out pydantic-settings above - it only works with v2!)
    "tenacity>=8.2.0",
    "structlog>=23.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "langfuse>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "respx>=0.20.0",
]

[project.scripts]
zendesk-ai-agent = "zendesk_ai_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing"
# Treat Pydantic deprecation warnings as errors (for Demo 2 - self-healing PR)
filterwarnings = [
    "error::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]
